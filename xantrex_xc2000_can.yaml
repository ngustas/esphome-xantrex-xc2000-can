    name: "Xantrex DC In Watts"
    unit_of_measurement: "W"
    device_class: power
    accuracy_decimals: 1
    update_interval: never
    filters:
      - throttle_average: ${AVG_WIN}
    lambda: return id(g_dc_in_watts);

  # --- FFC7: DC Charger Output ---
  - platform: template
    id: s_dc_chg_volts
    name: "Xantrex Charger Volts"
    unit_of_measurement: "V"
    device_class: voltage
    accuracy_decimals: 2
    update_interval: never
    filters:
      - throttle_average: ${AVG_WIN}
    lambda: return id(g_dc_chg_volts);

  - platform: template
