    lambda: return id(g_ac_out_freq);

  # --- 1FFD5: AC Output Power ---
  - platform: template
    id: s_ac_out_real_watts
    name: "Xantrex AC Out Real Power"
    unit_of_measurement: "W"
    device_class: power
    accuracy_decimals: 0
    update_interval: never
    filters:
