    device_class: temperature
    accuracy_decimals: 1
    update_interval: never
    filters:
      - throttle_average: ${AVG_WIN}
    lambda: return id(g_transformer_temp);

text_sensor:
  - platform: template
    id: s_inverter_state
    name: "Xantrex Inverter State"
    update_interval: 2s
    lambda: |-
      switch (id(g_inverter_state)) {
        case 0: return {"Off"};
        case 1: return {"Inverting"};
        case 2: return {"Pass-through"};
        case 3: return {"APS only"};
        case 4: return {"Load sense"};
        case 5: return {"Waiting to invert"};
        case 6: return {"Short circuit"};
        case 7: return {"Overtemperature"};
        case 8: return {"Undervoltage"};
        case 9: return {"Overvoltage"};
        case 10: return {"Internal fault"};
        case 11: return {"Communication lost"};
        default: return {"Unknown"};
      }

  - platform: template
    id: s_charger_state
    name: "Xantrex Charger State"
    update_interval: 2s
    lambda: |-
      switch (id(g_charger_state)) {
        case 0: return {"Undefined"};
        case 1: return {"Do not charge"};
        case 2: return {"Bulk"};
        case 3: return {"Absorption"};
        case 4: return {"Overcharge"};
        case 5: return {"Equalize"};
        case 6: return {"Float"};
        case 7: return {"Constant voltage/current"};
        default: return {"Unknown"};
      }

# ---------------------------------------------------------------------------
# Interval – publish on change, update CAN fps counter
# ---------------------------------------------------------------------------
interval:
  - interval: 2s
    then:
      - if:
          condition:
            lambda: 'return id(g_needs_publish);'
          then:
            - script.execute: publish_all_xantrex
            - lambda: 'id(g_needs_publish) = false;'
      - component.update: can_fps
