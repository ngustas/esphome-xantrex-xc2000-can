# ESPHome – Xantrex XC 2000 Pro CAN Bus Monitor
# Decodes J1939-style CAN frames from the Xantrex XC 2000 Pro and
# publishes DC/AC voltage, current, and power sensors to Home Assistant.
#
# Hardware tested: ESP32-S3-DevKitC-1 (has a built-in TWAI/CAN controller)
#   TX → GPIO11, RX → GPIO12 (via a SN65HVD230 or equivalent CAN transceiver)
#   CAN bus: 250 kbps, 29-bit extended IDs (J1939)
#
# NOTE: Classic ESP32 (WROOM-32) uses different safe GPIO pairs for TWAI,
#       e.g. GPIO21/GPIO22. Adjust tx_pin/rx_pin accordingly.
#
# RV-C DGNs decoded (the leading 1 is the J1939 data-page bit):
#   1FEE8 – Inverter DC Status      (volts + amps)
#   1FFC7 – Charger Status          (targets, percent, state)
#   1FEA3 – Charger Status 2        (measured volts/amps/temp; U3 >= 2.14)
#   1FFCA – AC Input Status         (volts + amps + Hz)
#   1FFD7 – AC Output Status        (volts + amps + Hz)
#   1FFD5 – AC Output Power         (real power + provisional reactive raw)
#   1FEBD – Inverter Temperature   (FET + transformer)
#   1FFD4 – Inverter Status        (operating state)
#   1FFFD – DC Source Status 1      (MEASURED net DC volts/amps)
#   1FFFC – DC Source Status 2      (source temperature; SOC is a placeholder)
#
# RECEIVE-ONLY BY DESIGN. This config never transmits: no address is claimed
# and no command frames are sent. Transmit was exercised separately on
# hardware to find out what the unit actually accepts -- 1FFC4 max charge
# current and 1FFC5 charger enable/disable both work; the 1FFC5 CC/CV control
# current is inert outside CC/CV mode; 1FFD3 inverter enable and pass-through
# are untested. Results, byte layouts and the safety argument are in
# CAN_DECODING.md. Do not bolt a transmitter on without reading it: 1FFC4
# writes non-volatile charger configuration.

esphome:
  name: xantrex-xc2000
  friendly_name: Xantrex XC2000

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf            # required for esp32_can / TWAI

logger:
  level: INFO
  logs:
    canbus: WARN             # suppress "received can message" spam
    esp32_can: WARN

api:
  encryption:
    key: !secret api_encryption_key
  on_client_connected:
    then:
      - script.execute: publish_all_xantrex

ota:
  platform: esphome
  password: !secret ota_password

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
  ap:
    ssid: "Xantrex Fallback Hotspot"
    password: !secret ap_fallback_password

captive_portal:

substitutions:
  # Averaging window for all sensor filters
  AVG_WIN: "2s"

  # 0xFF auto-discovers the Xantrex from inverter-specific status DGNs.
  # U3 <= 2.13 commonly used 0x42; U3 >= 2.14 defaults to 0x8F and supports
  # dynamic addressing. Pin an address only when multiple inverters share a bus.
  xantrex_source_address: "0xFF"

  # Observed/default instances. Change these to match the unit configuration.
  inv_instance: "1"
  ac_instance: "0x41"

  # DC source instance on DC_SOURCE_STATUS_1/2 (1FFFD/1FFFC). U3 2.16 made
  # this configurable separately from inv_instance. A BMS also transmits
  # these DGNs; the source-address filter is what keeps them apart here.
  dcsrc_instance: "1"

# ---------------------------------------------------------------------------
# CAN bus
# ---------------------------------------------------------------------------
canbus:
  - platform: esp32_can
    id: xantrex_can
    tx_pin: GPIO11
    rx_pin: GPIO12
    can_id: 0x01             # source address this node uses on the J1939 bus
    bit_rate: 250kbps
    use_extended_id: true
    # Optional: filter to known Xantrex DGNs to reduce interrupt load.
    # Mask 0x1FFFFF00 matches any source address (low byte = SA, ignored).
    # filters:
    #   - id: 0x19FEE800     # 1FEE8 – Inverter DC Status
    #     mask: 0x1FFFFF00
    #     extended: true
    #   - id: 0x19FFC700     # 1FFC7 – Charger Status
    #     mask: 0x1FFFFF00
    #     extended: true
    #   - id: 0x19FFCA00     # 1FFCA – AC Input Status
    #     mask: 0x1FFFFF00
    #     extended: true
    #   - id: 0x19FFD500     # 1FFD5 – AC Output Power
    #     mask: 0x1FFFFF00
    #     extended: true
    #   - id: 0x19FFD700     # 1FFD7 – AC Output Status
    #     mask: 0x1FFFFF00
    #     extended: true
    on_frame:
      - can_id: 0x00000000
        can_id_mask: 0x00000000   # catch-all: receive every extended frame
        use_extended_id: true
        then:
          - lambda: |-
              // Extract the full 18-bit J1939/RV-C DGN, including data page.
              const uint32_t arb = can_id;
              const uint8_t  pf  = (arb >> 16) & 0xFF;
              const uint8_t  src = arb & 0xFF;
              uint32_t dgn = (arb >> 8) & 0x3FFFF;
              if (pf < 0xF0) dgn &= 0x3FF00; // PDU1: PS is destination

              const auto &d = x;
              if (d.size() < 8) return;

              // Early captures/tools omitted the data-page bit and called these
              // FEE8/FFC7/etc. Accept that representation too, but use the full
              // RV-C DGN everywhere else in this file.
              switch (dgn) {
                case 0xFEE8: case 0xFFC7: case 0xFEA3: case 0xFFCA:
                case 0xFFD7: case 0xFFD5: case 0xFEBD: case 0xFFD4:
                  dgn |= 0x10000;
                  break;
                default: break;
              }

              // The communication card is arbitrary-address-capable. In auto
              // mode, latch only from inverter-specific DGNs (not generic BMS
              // traffic), and allow rediscovery after 30 s of silence.
              constexpr uint8_t configured_src = ${xantrex_source_address};
              const bool inverter_signature =
                  ((dgn == 0x1FEE8 || dgn == 0x1FFCA ||
                    dgn == 0x1FEBD || dgn == 0x1FFD4) &&
                   d[0] == ${inv_instance}) ||
                  ((dgn == 0x1FFD7 || dgn == 0x1FFD5) &&
                   d[0] == ${ac_instance});
              const uint32_t now_ms = millis();
              if (configured_src == 0xFF && inverter_signature &&
                  (id(g_xantrex_src) == 0xFF ||
                   now_ms - id(g_xantrex_src_ms) > 30000)) {
                if (id(g_xantrex_src) != src)
                  ESP_LOGI("xantrex", "discovered source address 0x%02X", src);
                id(g_xantrex_src) = src;
              }
              if (src != id(g_xantrex_src)) return;
              if (inverter_signature) id(g_xantrex_src_ms) = now_ms;

              // Helpers
              auto u16_le  = [](uint8_t b0, uint8_t b1) -> uint16_t { return (uint16_t)b1 << 8 | b0; };
              // RV-C reserves the upper end of most uint16 parameter ranges.
              auto valid16 = [](uint16_t v){ return v <= 64255; };
              auto valid_hz = [](uint16_t v){ return v <= 64000; };
              auto round1  = [](float v){ return roundf(v * 10.0f)  / 10.0f; };
              auto round2  = [](float v){ return roundf(v * 100.0f) / 100.0f; };
              auto near0   = [](float v){ return fabsf(v) < 0.5f; };

              id(can_frame_count)++;
              bool updated = false;

              switch (dgn) {

                // ----- FEE8: DC Inverter Input -----
                // Byte 1-2: DC voltage  → raw / 20  [V]
                // Byte 3-4: DC current  → (raw - 32000) / 20  [A], + = discharge
                case 0x1FEE8: {
                  if (d[0] != ${inv_instance}) return;
                  uint16_t vraw = u16_le(d[1], d[2]);
                  uint16_t iraw = u16_le(d[3], d[4]);
                  if (valid16(vraw)) {
                    float v = vraw / 20.0f;
                    if (v >= 9.0f && v <= 64.0f) {
                      id(g_dc_in_volts)  = round2(v);
                      id(g_dc_chg_volts) = id(g_dc_in_volts); // shared for charger-watts calc
                      updated = true;
                    }
                  }
                  if (valid16(iraw)) {
                    float i = (iraw - 32000) / 20.0f;
                    i = i * id(g_dc_current_gain) + id(g_dc_current_offset);
                    if (id(g_invert_dc_current)) i = -i;  // flip for Victron-style sign convention
                    if (near0(i)) i = 0.0f;
                    if (i >= -800.0f && i <= 800.0f) {
                      id(g_dc_in_amps) = round1(i);
                      updated = true;
                    }
                  }
                  id(g_dc_in_watts) = round1(id(g_dc_in_volts) * id(g_dc_in_amps));
                  updated = true;
                  break;
                }

                // ----- FFC7: DC Charger Output -----
                // Byte 1-2: desired/control voltage
                // Byte 3-4: desired/control current
                // Byte 5: charge current percent of maximum, raw / 2 [%]
                case 0x1FFC7: {
                  if (d[0] != ${inv_instance}) return;
                  uint16_t vraw = u16_le(d[1], d[2]);
                  uint16_t iraw = u16_le(d[3], d[4]);
                  if (valid16(vraw)) {
                    float v = vraw / 20.0f;
                    if (v >= 9.0f && v <= 64.0f) id(g_dc_chg_volts) = round2(v);
                  }
                  if (valid16(iraw)) {
                    // This is the desired/control current on newer firmware,
                    // not necessarily an independent measured battery current.
                    id(g_dc_chg_amps) = round1((iraw - 32000) / 20.0f);
                    id(g_dc_chg_watts) = round1(id(g_dc_chg_volts) * id(g_dc_chg_amps));
                    updated = true;
                  }
                  id(g_charge_percent) = d[5] <= 250 ? d[5] / 2.0f : NAN;
                  id(g_charger_state) = d[6];
                  break;
                }

                // ----- 1FEA3: Charger Status 2 (U3 >= 2.14) -----
                // Measured output voltage/current. Byte 7 is degC with -40 offset.
                case 0x1FEA3: {
                  if ((d[0] & 0x0F) != ${inv_instance}) return;
                  uint16_t vraw = u16_le(d[3], d[4]);
                  uint16_t iraw = u16_le(d[5], d[6]);
                  if (valid16(vraw)) id(g_chg2_volts) = round2(vraw / 20.0f);
                  if (valid16(iraw)) id(g_chg2_amps) = round1((iraw - 32000) / 20.0f);
                  id(g_chg2_watts) = round1(id(g_chg2_volts) * id(g_chg2_amps));
                  id(g_chg2_temp) = d[7] <= 250 ? (float)d[7] - 40.0f : NAN;
                  updated = true;
                  break;
                }

                // ----- FFCA: AC Input -----
                // Byte 1-2: AC voltage    → raw / 20         [V]
                // Byte 3-4: AC current    → (raw - 32000)/20 [A]
                // Byte 5-6: AC frequency  → raw / 128        [Hz]  reads 0 when no AC present
                case 0x1FFCA: {
                  if (d[0] != ${inv_instance}) return;
                  uint16_t vraw = u16_le(d[1], d[2]);
                  uint16_t iraw = u16_le(d[3], d[4]);
                  uint16_t fraw = u16_le(d[5], d[6]);
                  if (valid16(vraw)) {
                    float v = vraw / 20.0f;
                    if (v >= 0.0f && v <= 300.0f) { id(g_ac_in_volts) = round1(v); updated = true; }
                  }
                  if (valid16(iraw)) {
                    float i = (iraw - 32000) / 20.0f;
                    if (i >= -200.0f && i <= 200.0f) { id(g_ac_in_amps) = round1(i); updated = true; }
                  }
                  id(g_ac_in_watts) = round1(id(g_ac_in_volts) * id(g_ac_in_amps));
                  if (valid_hz(fraw)) {
                    float hz = fraw / 128.0f;
                    if (hz >= 45.0f && hz <= 70.0f) { id(g_ac_in_freq) = roundf(hz * 10.0f) / 10.0f; updated = true; }
                  }
                  updated = true;
                  break;
                }

                // ----- FFD7: AC Output -----
                // Same byte layout as FFCA; output frequency tracks input when AC is present
                case 0x1FFD7: {
                  if (d[0] != ${ac_instance}) return;
                  uint16_t vraw = u16_le(d[1], d[2]);
                  uint16_t iraw = u16_le(d[3], d[4]);
                  uint16_t fraw = u16_le(d[5], d[6]);
                  if (valid16(vraw)) {
                    float v = vraw / 20.0f;
                    if (v >= 0.0f && v <= 300.0f) { id(g_ac_out_volts) = round1(v); updated = true; }
                  }
                  if (valid16(iraw)) {
                    float i = (iraw - 32000) / 20.0f;
                    if (i >= -200.0f && i <= 200.0f) { id(g_ac_out_amps) = round1(i); updated = true; }
                  }
                  id(g_ac_out_watts) = round1(id(g_ac_out_volts) * id(g_ac_out_amps));
                  if (valid_hz(fraw)) {
                    float hz = fraw / 128.0f;
                    if (hz >= 45.0f && hz <= 70.0f) { id(g_ac_out_freq) = roundf(hz * 10.0f) / 10.0f; updated = true; }
                  }
                  updated = true;
                  break;
                }

                // ----- 1FFD5: AC Output Power -----
                // The earlier single-byte interpretation was wrong: bytes 2-3
                // and 4-5 are little-endian fields. Real power is consistent
                // with captures; reactive power signedness/scaling is provisional.
                case 0x1FFD5: {
                  if (d[0] != ${ac_instance}) return;
                  uint16_t real = u16_le(d[2], d[3]);
                  uint16_t reactive = u16_le(d[4], d[5]);
                  if (real <= 65530) { id(g_ac_out_real_watts) = (float)real; updated = true; }
                  if (reactive <= 65530) { id(g_ac_out_reactive_raw) = (float)reactive; updated = true; }
                  break;
                }

                // ----- 1FEBD: Inverter Temperature Status -----
                // uint16 fields: raw / 32 - 273 C. U3 2.14 fixed FET1 reporting.
                case 0x1FEBD: {
                  if (d[0] != ${inv_instance}) return;
                  uint16_t fet = u16_le(d[1], d[2]);
                  uint16_t transformer = u16_le(d[3], d[4]);
                  if (valid16(fet)) id(g_fet_temp) = round1(fet / 32.0f - 273.0f);
                  if (valid16(transformer)) id(g_transformer_temp) = round1(transformer / 32.0f - 273.0f);
                  updated = true;
                  break;
                }

                // ----- 1FFD4: Inverter Status -----
                // ----- 1FFFD: DC Source Status 1 -----
                // The only MEASURED net DC current this unit publishes.
                // FEE8 is inverter *input* (~0 while charging or in
                // pass-through) and FFC7 current is a setpoint, so neither
                // tracks the battery. Byte 4-7 is uint32, 0.001 A/bit with
                // 0 A at 0x77359400 (RV-C Table 5.3) -- a different width and
                // offset from the uint16 0.05 A fields used elsewhere.
                // Observed: sign is inverted relative to a battery shunt, so
                // it is negated here to give + = charging. The unit also
                // quantises to 0.128 A (low 7 bits always zero).
                case 0x1FFFD: {
                  if (d[0] != ${dcsrc_instance}) return;
                  uint16_t vraw = u16_le(d[2], d[3]);
                  if (valid16(vraw)) {
                    float v = vraw / 20.0f;
                    if (v >= 9.0f && v <= 64.0f) {
                      id(g_dc_src_volts) = round2(v);
                      updated = true;
                    }
                  }
                  uint32_t iraw = (uint32_t) d[4] | ((uint32_t) d[5] << 8) |
                                  ((uint32_t) d[6] << 16) | ((uint32_t) d[7] << 24);
                  if (iraw <= 0xFFFFFFFCu) {
                    double i = -(((double) iraw - 2000000000.0) * 0.001);
                    // Discharge-only correction. Observed on a 300 Ah bank:
                    // while inverting this field read ~30% low against a shunt
                    // and a clamp meter, but while charging it agreed within
                    // 1% over 45-100 A. Applying a gain in both directions
                    // would corrupt the charge readings.
                    if (i < 0) i *= id(g_dc_current_gain);
                    if (near0((float) i)) i = 0.0;
                    if (i >= -800.0 && i <= 800.0) {
                      id(g_dc_src_amps) = round2((float) i);
                      updated = true;
                    }
                  }
                  id(g_dc_src_watts) = round1(id(g_dc_src_volts) * id(g_dc_src_amps));
                  break;
                }

                // ----- 1FFFC: DC Source Status 2 -----
                // Temperature is real. State of charge and time remaining are
                // NOT populated by this unit -- see CAN_DECODING.md. SoC is
                // emitted as a constant 100% placeholder (byte 4 = 200), which
                // is a valid encoding rather than the "unavailable" code, so it
                // cannot be filtered out. Exposed as diagnostic only.
                case 0x1FFFC: {
                  if (d[0] != ${dcsrc_instance}) return;
                  uint16_t traw = u16_le(d[2], d[3]);
                  if (valid16(traw)) {
                    float t = traw / 32.0f - 273.0f;
                    if (t >= -50.0f && t <= 200.0f) {
                      id(g_dc_src_temp) = round1(t);
                      updated = true;
                    }
                  }
                  id(g_dc_src_soc) = d[4] <= 250 ? d[4] * 0.5f : NAN;
                  uint16_t tr = u16_le(d[5], d[6]);
                  id(g_dc_src_time_left) = tr <= 65532 ? (float) tr : NAN;
                  updated = true;
                  break;
                }

                case 0x1FFD4: {
                  if (d[0] != ${inv_instance}) return;
                  id(g_inverter_state) = d[1] & 0x0F;
                  updated = true;
                  break;
                }

                default:
                  break;
              }

              if (updated) id(g_needs_publish) = true;

# ---------------------------------------------------------------------------
# Globals
# ---------------------------------------------------------------------------
globals:
  # DC current calibration. Applies to FEE8 (inverter DC input, only non-zero
  # while inverting) and to the DISCHARGE half of 1FFFD only -- this unit
  # under-reports inverter draw by roughly 30% against a shunt and a clamp
  # meter (7.53 A vs 9.77 A; 7.04 A vs 9.33 A) while its charge current is
  # accurate to within 1% over 45-100 A. 1.30 matches the observed unit;
  # verify against a reference meter before trusting it, and note the
  # calibration rests on a single load point.
  - id: g_dc_current_gain
    type: float
    initial_value: '1.0'
  - id: g_dc_current_offset
    type: float
    initial_value: '0.0'
  # Set true to flip DC current polarity (+ = charging, Victron convention)
  - id: g_invert_dc_current
    type: bool
    initial_value: 'false'
  - id: g_needs_publish
    type: bool
    initial_value: 'false'
  - id: can_frame_count
    type: uint32_t
    initial_value: '0'
  - id: g_xantrex_src
    type: uint8_t
    initial_value: '${xantrex_source_address}'
  - id: g_xantrex_src_ms
    type: uint32_t
    initial_value: '0'
  # 1FFFD / 1FFFC – DC Source Status (measured net DC, temperature)
  - id: g_dc_src_volts
    type: float
    initial_value: '0.0'
  - id: g_dc_src_amps
    type: float
    initial_value: '0.0'
  - id: g_dc_src_watts
    type: float
    initial_value: '0.0'
  - id: g_dc_src_temp
    type: float
    initial_value: 'NAN'
  - id: g_dc_src_soc
    type: float
    initial_value: 'NAN'
  - id: g_dc_src_time_left
    type: float
    initial_value: 'NAN'
  # FEE8 – DC Inverter Input
  - id: g_dc_in_volts
    type: float
    initial_value: '0.0'
  - id: g_dc_in_amps
    type: float
    initial_value: '0.0'
  - id: g_dc_in_watts
    type: float
    initial_value: '0.0'
  # FFC7 – DC Charger Output (volts mirrored from FEE8)
  - id: g_dc_chg_volts
    type: float
    initial_value: '0.0'
  - id: g_dc_chg_amps
    type: float
    initial_value: '0.0'
  - id: g_dc_chg_watts
    type: float
    initial_value: '0.0'
  - id: g_charge_percent
    type: float
    initial_value: '0.0'
  - id: g_charger_state
    type: uint8_t
    initial_value: '255'
  # 1FEA3 – measured Charger Status 2 values (U3 >= 2.14)
  - id: g_chg2_volts
    type: float
    initial_value: '0.0'
  - id: g_chg2_amps
    type: float
    initial_value: '0.0'
  - id: g_chg2_watts
    type: float
    initial_value: '0.0'
  - id: g_chg2_temp
    type: float
    initial_value: '0.0'
  # FFCA – AC Input
  - id: g_ac_in_volts
    type: float
    initial_value: '0.0'
  - id: g_ac_in_amps
    type: float
    initial_value: '0.0'
  - id: g_ac_in_watts
    type: float
    initial_value: '0.0'
  - id: g_ac_in_freq
    type: float
    initial_value: '0.0'
  # FFD7 – AC Output
  - id: g_ac_out_volts
    type: float
    initial_value: '0.0'
  - id: g_ac_out_amps
    type: float
    initial_value: '0.0'
  - id: g_ac_out_watts
    type: float
    initial_value: '0.0'
  - id: g_ac_out_freq
    type: float
    initial_value: '0.0'
  # 1FFD5 – AC output power
  - id: g_ac_out_real_watts
    type: float
    initial_value: '0.0'
  - id: g_ac_out_reactive_raw
    type: float
    initial_value: '0.0'
  # 1FEBD / 1FFD4
  - id: g_fet_temp
    type: float
    initial_value: '0.0'
  - id: g_transformer_temp
    type: float
    initial_value: '0.0'
  - id: g_inverter_state
    type: uint8_t
    initial_value: '255'

# ---------------------------------------------------------------------------
# Script – push all cached values to HA at once
# ---------------------------------------------------------------------------
script:
  - id: publish_all_xantrex
    then:
      - component.update: s_dc_in_volts
      - component.update: s_dc_in_amps
      - component.update: s_dc_in_watts
      - component.update: s_dc_chg_volts
      - component.update: s_dc_chg_amps
      - component.update: s_dc_chg_watts
      - component.update: s_charge_percent
      - component.update: s_chg2_volts
      - component.update: s_chg2_amps
      - component.update: s_chg2_watts
      - component.update: s_chg2_temp
      - component.update: s_ac_in_volts
      - component.update: s_ac_in_amps
      - component.update: s_ac_in_watts
      - component.update: s_ac_in_freq
      - component.update: s_ac_out_volts
      - component.update: s_ac_out_amps
      - component.update: s_ac_out_watts
      - component.update: s_ac_out_freq
      - component.update: s_ac_out_real_watts
      - component.update: s_ac_out_reactive_raw
      - component.update: s_fet_temp
      - component.update: s_transformer_temp
      - component.update: s_dc_src_volts
      - component.update: s_dc_src_amps
      - component.update: s_dc_src_watts
      - component.update: s_dc_src_temp
      - component.update: s_dc_src_soc
      - component.update: s_dc_src_time_left
      - component.update: s_xantrex_src

# ---------------------------------------------------------------------------
# Sensors
# ---------------------------------------------------------------------------
sensor:
  - platform: template
    id: can_fps
    name: "CAN Frames per Second"
    unit_of_measurement: "fps"
    accuracy_decimals: 0
    update_interval: never
    filters:
      - throttle_average: ${AVG_WIN}
    lambda: |-
      static bool     inited = false;
      static uint32_t last   = 0;
      uint32_t now  = id(can_frame_count);
      uint32_t diff = inited ? (now - last) : 0;
      inited = true;
      last   = now;
      return (float) diff;

  # --- 1FFFD / 1FFFC: DC Source Status ---------------------------------
  # s_dc_src_amps is the measured net DC current and is the figure to trust
  # for battery flow; + = charging after the sign correction.
  - platform: template
    id: s_dc_src_volts
    name: "DC Source Volts"
    device_class: voltage
    unit_of_measurement: "V"
    accuracy_decimals: 2
    update_interval: never
    lambda: |-
      return id(g_dc_src_volts);

  - platform: template
    id: s_dc_src_amps
    name: "DC Source Amps"
    device_class: current
    unit_of_measurement: "A"
    accuracy_decimals: 2
    update_interval: never
    lambda: |-
      return id(g_dc_src_amps);

  - platform: template
    id: s_dc_src_watts
    name: "DC Source Watts"
    device_class: power
    unit_of_measurement: "W"
    accuracy_decimals: 1
    update_interval: never
    lambda: |-
      return id(g_dc_src_watts);

  - platform: template
    id: s_dc_src_temp
    name: "DC Source Temperature"
    device_class: temperature
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: never
    lambda: |-
      return id(g_dc_src_temp);

  # DIAGNOSTIC ONLY. The observed unit has no battery capacity configured
  # (1FFC6 bank size reads "not available" and 1FFFB is not implemented), so
  # it cannot compute a real state of charge and emits a constant 100%.
  # Kept because another unit or firmware may populate it; do not build
  # automations on it without checking it actually moves.
  - platform: template
    id: s_dc_src_soc
    name: "DC Source SOC (unverified)"
    entity_category: diagnostic
    device_class: battery
    unit_of_measurement: "%"
    accuracy_decimals: 1
    update_interval: never
    lambda: |-
      return id(g_dc_src_soc);

  - platform: template
    id: s_dc_src_time_left
    name: "DC Source Time Remaining"
    entity_category: diagnostic
    device_class: duration
    unit_of_measurement: "min"
    accuracy_decimals: 0
    update_interval: never
    lambda: |-
      return id(g_dc_src_time_left);
  - platform: template
    id: s_xantrex_src
    name: "Xantrex CAN Source Address"
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: never
    lambda: |-
      if (id(g_xantrex_src) == 0xFF) return NAN;
      return (float) id(g_xantrex_src);

  # --- FEE8: DC Inverter Input ---
  - platform: template
    id: s_dc_in_volts
    name: "Xantrex DC In Volts"
    unit_of_measurement: "V"
    device_class: voltage
    accuracy_decimals: 2
    update_interval: never
    filters:
      - throttle_average: ${AVG_WIN}
    lambda: return id(g_dc_in_volts);

  - platform: template
    id: s_dc_in_amps
    name: "Xantrex DC In Amps"
    unit_of_measurement: "A"
    device_class: current
    accuracy_decimals: 1
    update_interval: never
    filters:
      - throttle_average: ${AVG_WIN}
    lambda: return id(g_dc_in_amps);

  - platform: template
