    name: "Xantrex Charger Watts"
    unit_of_measurement: "W"
    device_class: power
    accuracy_decimals: 1
    update_interval: never
    filters:
      - throttle_average: ${AVG_WIN}
    lambda: return id(g_dc_chg_watts);

  - platform: template
    id: s_charge_percent
    name: "Xantrex Charge Current Percent of Max"
    unit_of_measurement: "%"
    device_class: battery
    accuracy_decimals: 1
    update_interval: never
    filters:
      - throttle_average: ${AVG_WIN}
    lambda: return id(g_charge_percent);

  # --- 1FEA3: Charger Status 2 (measured output; U3 >= 2.14) ---
  - platform: template
    id: s_chg2_volts
    name: "Xantrex Charger Measured Volts"
    unit_of_measurement: "V"
    device_class: voltage
    accuracy_decimals: 2
    update_interval: never
    filters:
      - throttle_average: ${AVG_WIN}
    lambda: return id(g_chg2_volts);

  - platform: template
    id: s_chg2_amps
    name: "Xantrex Charger Measured Amps"
    unit_of_measurement: "A"
    device_class: current
    accuracy_decimals: 1
    update_interval: never
    filters:
      - throttle_average: ${AVG_WIN}
    lambda: return id(g_chg2_amps);

  - platform: template
    id: s_chg2_watts
    name: "Xantrex Charger Measured Watts"
    unit_of_measurement: "W"
    device_class: power
    accuracy_decimals: 1
    update_interval: never
    filters:
      - throttle_average: ${AVG_WIN}
    lambda: return id(g_chg2_watts);

  - platform: template
    id: s_chg2_temp
    name: "Xantrex Charger Temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    update_interval: never
    filters:
      - throttle_average: ${AVG_WIN}
    lambda: return id(g_chg2_temp);

  # --- FFCA: AC Input ---
  - platform: template
    id: s_ac_in_volts
    name: "Xantrex AC In Volts"
    unit_of_measurement: "V"
    device_class: voltage
    accuracy_decimals: 1
    update_interval: never
    filters:
      - throttle_average: ${AVG_WIN}
    lambda: return id(g_ac_in_volts);

  - platform: template
    id: s_ac_in_amps
    name: "Xantrex AC In Amps"
    unit_of_measurement: "A"
    device_class: current
    accuracy_decimals: 1
    update_interval: never
