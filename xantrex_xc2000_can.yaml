    accuracy_decimals: 1
    update_interval: never
    filters:
      - throttle_average: ${AVG_WIN}
    lambda: return id(g_ac_in_freq);

  # --- FFD7: AC Output ---
  - platform: template
    id: s_ac_out_volts
    name: "Xantrex AC Out Volts"
    unit_of_measurement: "V"
    device_class: voltage
